service:
  name: "fraud_detection"
  workers: 4
  timeout: 30

batching:
  enabled: true
  max_batch_size: 32
  max_latency_ms: 100

model:
  name: "fraud_classifier"
  version: "latest"
  framework: "sklearn"
  feature_names:
    - "amount"
    - "hour_of_day"
    - "day_of_week"
    - "merchant_category"
    - "transaction_type"
    - "distance_from_home"
    - "distance_from_last_transaction"
    - "ratio_to_median_purchase_price"
    - "used_pin"
    - "online_order"

preprocessing:
  scaler: "standard"
  handle_missing: "median"

monitoring:
  enable_metrics: true
  metrics_port: 9090
  log_predictions: true
